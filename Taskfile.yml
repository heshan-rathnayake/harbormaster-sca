# One entry point for every language. Each service adds its own Taskfile
# under `includes` when it is created, e.g. `task findings:test`.
version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  setup:
    desc: Install dependencies, git hooks and a local .env (run `mise install` first)
    cmds:
      - test -f .env || cp .env.example .env
      - pnpm install
      - lefthook install

  up:
    desc: Start local infrastructure (Postgres, Redpanda, Grafana, S3)
    cmds:
      - docker compose up -d --wait

  down:
    desc: Stop local infrastructure (keeps the data)
    cmds:
      - docker compose down

  reset:
    desc: Stop local infrastructure and delete its data
    prompt: This deletes all local databases, topics and stored files. Continue?
    cmds:
      - docker compose down -v

  lint:
    desc: Lint all code
    cmds:
      - pnpm exec turbo run lint

  check-types:
    desc: Type-check all code
    cmds:
      - pnpm exec turbo run check-types

  test:
    desc: Run all tests
    cmds:
      - pnpm exec turbo run test

  build:
    desc: Build everything
    cmds:
      - pnpm exec turbo run build

  fmt:
    desc: Format all files
    cmds:
      - pnpm exec prettier --write .

  fmt:check:
    desc: Check formatting without changing anything
    cmds:
      - pnpm exec prettier --check .
