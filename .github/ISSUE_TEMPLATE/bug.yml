name: Bug report
description: Something doesn't work as expected
labels: ["type:fix"]
body:
  - type: markdown
    attributes:
      value: |
        Found a security vulnerability? Please don't open an issue. Follow the [security policy](https://github.com/heshan-rathnayake/harbormaster-sca/security/policy) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `harbormaster scan` in ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `harbormaster version`, or the commit SHA.
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Remove any tokens, API keys or personal data first.
      render: shell
