name: Task
description: A planned piece of work, sized for one PR
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One sentence. What will be true when this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, related ADRs, open questions.
