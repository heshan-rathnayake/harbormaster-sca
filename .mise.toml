# Exact versions so every machine and CI runner match. Run `mise install` after cloning.
# Rust is pinned by rust-toolchain.toml and Python by uv in each service, their ecosystems' own standards.
[tools]
node = "24.21.0"
pnpm = "12.6.0"
go = "1.27.1"
uv = "0.12.19"
task = "3.53.1"
lefthook = "2.1.14"
gitleaks = "8.30.1"
